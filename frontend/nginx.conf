server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 前端路由回退到 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理（无尾斜杠 = 保留原始路径）。
    location /health {
        proxy_pass http://backend:8000;
    }
    location /overview {
        proxy_pass http://backend:8000;
    }
    location /projects {
        proxy_pass http://backend:8000;
    }
    location /traces {
        proxy_pass http://backend:8000;
    }
    location /diagnose {
        proxy_pass http://backend:8000;
    }
    location /knowledge {
        proxy_pass http://backend:8000;
    }
    location /evaluation {
        proxy_pass http://backend:8000;
    }
}
