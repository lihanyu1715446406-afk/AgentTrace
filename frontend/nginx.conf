server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 前端路由回退到 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 统一走 /api 前缀：去掉 /api 后转发给后端。
    # 没有独立前缀时，/traces、/evaluation 等路径会与 SPA 路由冲突
    # （刷新页面时被转发到后端，返回 404/401）。
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
    }

    # 健康检查（与 SPA 路由无冲突，可直连）。
    location = /health {
        proxy_pass http://backend:8000;
    }
}
